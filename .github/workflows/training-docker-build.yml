name: Build and Push Training Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'training.docker/**'

# 版本矩阵：改动下方 ARG 即发布新镜像 tag。
# 训练 Job 固定到具体 tag，不要依赖 latest。

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract build args from Dockerfile
        id: vars
        run: |
          set -euo pipefail
          d=training.docker
          CUDA_VERSION=$(grep -m1 '^ARG CUDA_VERSION=' $d/Dockerfile.base | cut -d= -f2)

          UBUNTU_VERSION=$(grep -m1 '^ARG UBUNTU_VERSION=' $d/Dockerfile.base | cut -d= -f2)
          PYTHON_VERSION=$(grep -m1 '^ARG PYTHON_VERSION=' $d/Dockerfile.base | cut -d= -f2)
          TORCH_VERSION=$(grep -m1 '^ARG TORCH_VERSION=' $d/Dockerfile.pytorch | cut -d= -f2)
          CU_SUFFIX="${CUDA_VERSION//./}"      # 12.4 -> cu124

          {
            echo "CUDA_VERSION=${CUDA_VERSION}"

            echo "UBUNTU_VERSION=${UBUNTU_VERSION}"
            echo "PYTHON_VERSION=${PYTHON_VERSION}"
            echo "TORCH_VERSION=${TORCH_VERSION}"
            echo "CU_SUFFIX=${CU_SUFFIX}"
          } >> "$GITHUB_ENV"

          echo "staged versions: torch=$TORCH_VERSION py=$PYTHON_VERSION cu=$CU_SUFFIX base=$CUDA_VERSION-ubu$UBUNTU_VERSION"

      - name: Set up buildx and cache
        uses: docker/setup-buildx-action@v3

      # ---------------- 第一层：training-base ----------------
      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: ./training.docker
          file: ./training.docker/Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/training-base:cuda${{ env.CUDA_VERSION }}-ubuntu${{ env.UBUNTU_VERSION }}-py${{ env.PYTHON_VERSION }}
            ghcr.io/${{ github.repository_owner }}/training-base:${{ github.sha }}
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            CUDA_VERSION=${{ env.CUDA_VERSION }}

            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- 第二层：training-pytorch ----------------
      - name: Build and push pytorch image
        uses: docker/build-push-action@v6
        with:
          context: ./training.docker
          file: ./training.docker/Dockerfile.pytorch
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/training-pytorch:torch${{ env.TORCH_VERSION }}-py${{ env.PYTHON_VERSION }}-cu${{ env.CU_SUFFIX }}
            ghcr.io/${{ github.repository_owner }}/training-pytorch:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/training-base:cuda${{ env.CUDA_VERSION }}-ubuntu${{ env.UBUNTU_VERSION }}-py${{ env.PYTHON_VERSION }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max